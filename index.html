(function(){
const PW="gss-pw",MAP="gss-m",SID="gss-sid",FU="gss-fu",POS="gss-pos";

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

async function unseal(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(D.salt),iterations:D.it},base,512));
  const ek=await crypto.subtle.importKey("raw",bits.slice(0,32),{name:"AES-CBC"},false,["decrypt"]);
  const mk=await crypto.subtle.importKey("raw",bits.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const iv=b64(D.iv),ct=b64(D.ct),mb=new Uint8Array(iv.length+ct.length);mb.set(iv);mb.set(ct,iv.length);
  if(!await crypto.subtle.verify("HMAC",mk,b64(D.tag),mb))return null;

const saveM=()=>ls.set(MAP,JSON.stringify(M));
function apply(){P.keys.forEach((k,j)=>{const el=$("d"+(j+1));if(el)el.checked=(M[k]||0)>0;});}
function stat(t){const s=$("gsy");if(s)s.textContent=t;}
function merge(o){let ch=false;for(const k in o){const v=+o[k],c=M[k];if(!isFinite(v)||!v)continue;if(c===undefined||Math.abs(v)>Math.abs(c)){M[k]=v;ch=true;}}return ch;}
async function sync(){
  const sid=ls.get(SID);
  if(!P||!P.sync||!sid)return;
  if(busy){again=true;return;}busy=true;stat("맞추는 중…");
  try{
    const r=await fetch(P.sync,{method:"POST",body:JSON.stringify({id:sid,m:M})});
    const j=await r.json();
    if(!j||!j.ok)throw new Error(j&&j.err||"응답");
    if(merge(j.m||{})){saveM();apply();}
    const d=new Date();stat("맞춤 "+d.getHours()+":"+String(d.getMinutes()).padStart(2,"0"));
  }catch(e){stat("못 맞춤(다음에 다시 함)");}
  finally{busy=false;if(again){again=false;setTimeout(sync,500);}}
}
const soon=()=>{clearTimeout(tm);tm=setTimeout(sync,1500);};
function syncLine(){
  const st=document.querySelector(".stamp");if(!st||!P.sync)return;
  const w=document.createElement("div");w.className="stamp";
  const draw=()=>{const sid=ls.get(SID);
    w.innerHTML=sid?'동기화 이름 <b id="gsn"></b> · <span id="gsy"></span> · <a href="#" id="gsc">바꾸기</a>':'동기화 안 함(이 기기에만 남음) · <a href="#" id="gsc">켜기</a>';
    if(sid)$("gsn").textContent=sid;
    $("gsc").onclick=e=>{e.preventDefault();const v=prompt("폰과 컴에 같은 동기화 이름을 넣음. 비우면 동기화를 끔.",ls.get(SID)||"");if(v===null)return;const c=clean(v);if(c)ls.set(SID,c);else ls.del(SID);draw();sync();};};
  st.after(w);draw();
}
function mount(){
  const doc=new DOMParser().parseFromString(P.html,"text/html");P.html="";
  for(const s of [...doc.head.querySelectorAll("style")])document.head.appendChild(document.adoptNode(s));
  const g=$("gs");if(g)g.remove();
  document.body.replaceWith(document.adoptNode(doc.body));
  try{M=JSON.parse(ls.get(MAP)||"{}")||{}}catch(e){M={}}
  apply();
  const fu=$("fu");if(fu&&ls.get(FU)==="1")fu.checked=true;
  const gx=$("gx");if(gx){try{const n=document.createElement("script");n.textContent=gx.textContent;gx.remove();document.body.appendChild(n);}catch(e){}}

    const t=e.target;if(!t||!t.id)return;
    const m=/^d(\d+)$/.exec(t.id);

  window.addEventListener("focus",()=>sync());

}
function go(v){location.replace(location.pathname+"?v="+encodeURIComponent(v||Date.now()));}
function banner(v){
  let a=$("gnv");
  if(!a){a=document.createElement("a");a.id="gnv";a.href="#";a.textContent="새 판이 올라왔음. 누르면 바꿈.";
    a.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:99;background:#2f6fde;color:#fff;padding:12px;border-radius:10px;text-align:center;font:15px -apple-system,system-ui,sans-serif;text-decoration:none";

}
async function latest(){try{const r=await fetch("ver.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return null;return (await r.text()).trim()||null;}catch(e){return null;}}
async function checkNew(atLoad){
  const v=await latest();if(!v||v===D.ver)return false;

  banner(v);return false;

let last=Date.now();
