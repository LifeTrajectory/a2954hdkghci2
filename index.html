(function(){

  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(D.salt),iterations:D.it},base,512));

  if(h){try{history.replaceState(null,"",location.href.split("#")[0]);}catch(e){}location.replace(h);}
}
function go(v){location.replace(location.pathname+"?v="+encodeURIComponent(v||Date.now()));}
function banner(v){
  let a=$("gnv");
  if(!a){a=document.createElement("a");a.id="gnv";a.href="#";a.textContent="새 판이 올라왔음. 누르면 바꿈.";
    a.style.cssText="position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:99;background:#2f6fde;color:#fff;padding:12px;border-radius:10px;text-align:center;font:15px -apple-system,system-ui,sans-serif;text-decoration:none";
    a.onclick=e=>{e.preventDefault();go(a.dataset.v);};document.body.appendChild(a);}
  a.dataset.v=v;
}
async function latest(){try{const r=await fetch("ver.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return null;return (await r.text()).trim()||null;}catch(e){return null;}}
async function checkNew(atLoad){
  const v=await latest();if(!v||v===D.ver)return false;
  if(atLoad&&new URLSearchParams(location.search).get("v")!==v){go(v);return true;}
  banner(v);return false;
}
let last=Date.now();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState!=="visible")return;sync();if(Date.now()-last>60000){last=Date.now();checkNew(false);}});
async function open(pw,saved){
  msg("여는 중…");
  try{const x=await unseal(pw);
    if(!x){if(saved){ls.del(PW);msg("");}else msg("비밀번호가 맞지 않음.");return;}
    ls.set(PW,pw);P=x;mount();
  }catch(e){msg(e&&e.message==="old"?"iOS 16.4 이상에서 열림.":"열지 못함: "+(e&&e.message||e));}
}
(async()=>{
  if(await checkNew(true))return;
  if(!D.sy){const n=$("gn");n.style.display="none";n.nextElementSibling.style.display="none";}
  else if(ls.get(SID))$("gn").value=ls.get(SID);
  $("gf").addEventListener("submit",e=>{e.preventDefault();const n=clean($("gn").value);if(n)ls.set(SID,n);else ls.del(SID);open($("gp").value,false);});
  const pw=ls.get(PW);if(pw)open(pw,true);else msg("");
})();
})();
</script></body></html>
